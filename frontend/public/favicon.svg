<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Nested cut panels, guillotine-style layout. Transparent background;
       colors chosen at a mid lightness so they hold contrast on both white
       and dark surfaces instead of needing a filled board behind them. -->
  <rect x="3" y="3" width="18" height="16" rx="2" fill="#9e4cf0"/>
  <rect x="3" y="20.5" width="18" height="10.5" rx="2" fill="#7468f3"/>
  <rect x="3" y="32.5" width="18" height="12.5" rx="2" fill="#c139ef"/>
  <rect x="22.5" y="3" width="22.5" height="21" rx="2" fill="#3976ef"/>
  <rect x="22.5" y="25.5" width="8" height="19.5" rx="2" fill="#ee2b6c"/>
  <rect x="32" y="25.5" width="13" height="19.5" rx="2" fill="#9439ef"/>
</svg>
